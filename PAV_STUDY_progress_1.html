<style>
:root{--bg:#0a1017;--card:#121a24;--card2:#1a2430;--ln:#263346;--g:#2f8ff0;--gd:#2f8ff033;--g2:#7cc0ff;--bs:#1b5fae;--on:#fff;--tx:#edf3fa;--mu:#8b9bb1;--bad:#ff6b6b;--gl:radial-gradient(70% 45% at 90% 14%,#1b66c24d,transparent 72%),radial-gradient(55% 40% at 4% 96%,#1b66c226,transparent 70%);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--gl)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body[data-ny="1"]{--g:#7fe9ff;--gd:#7fe9ff26}
body[data-ny="1"]::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;background:radial-gradient(2px 2px at 20px 30px,var(--sf),transparent),radial-gradient(3px 3px at 90px 80px,var(--sf),transparent),radial-gradient(2px 2px at 60px 110px,var(--sf2),transparent);background-size:130px 130px;animation:sn 9s linear infinite;filter:var(--sg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:19px 16px 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
#logo{height:26px;mix-blend-mode:screen}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;cursor:pointer}
nav button.on{color:var(--g);background:var(--gd)}
main{max-width:900px;margin:0 auto;padding:16px 16px 100px}
@media(min-width:900px){nav{top:calc(57px + env(safe-area-inset-top,0px));bottom:auto;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:12px}nav button{flex-direction:row;font-size:15px;gap:10px;padding:12px}main{margin-left:190px;max-width:1000px;padding:24px 32px}}
h1{font-size:28px;margin:6px 0}h3{margin:0 0 4px;font-size:18px}.mu{color:var(--mu);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #0005}
.hov{cursor:pointer;transition:transform .2s,border-color .2s}.hov:hover{transform:translateY(-3px);border-color:var(--g)}
.ic{font-size:34px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--card2);margin-top:8px;cursor:pointer}.row:hover{outline:1px solid var(--g)}
.btn{display:block;width:100%;background:var(--g);color:var(--on);border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--bs);margin-top:14px}.btn:active{transform:translateY(3px);box-shadow:none}
.mini,.back,.x{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none;font-size:14px}.back{margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:5px 10px;font-size:14px;margin-left:6px;white-space:nowrap}
.bar{height:12px;background:var(--card2);border-radius:9px;overflow:hidden;flex:1;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.top{display:flex;gap:12px;align-items:center}.q{font-size:20px;font-weight:700;margin:12px 0;background:var(--card)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:14px;margin-top:10px;font:inherit;cursor:pointer}
.opt.on{border-color:var(--g);background:var(--gd)}.line{min-height:56px;border-bottom:2px dashed var(--ln);padding-bottom:6px}.line .opt{display:inline-block;width:auto;margin:4px}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin:6px 0}.inp:focus,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--g)}
.fb{padding:14px;border-radius:14px;margin-top:14px}.fb.ok{background:var(--gd);border:1px solid var(--g);animation:pop .4s}.fb.bad{background:#ff6b6b22;border:1px solid var(--bad);animation:sk .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 16px}.tabs button{background:var(--card);border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:8px 14px;font:inherit;white-space:nowrap;cursor:pointer}.tabs .on{background:var(--g);color:var(--on);border-color:var(--g);font-weight:700}
.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;margin:14px auto}.ring b{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px}
.dots{display:flex;gap:8px;justify-content:space-between}.dots div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.dots span{display:block;height:34px;margin-bottom:4px;border-radius:10px;background:var(--card2);line-height:34px;font-size:18px}
.av{font-size:28px;background:var(--card2);border:2px solid var(--ln);border-radius:14px;padding:4px 8px;cursor:pointer}.av.on{border-color:var(--g)}.big{font-size:56px;text-align:center}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes sn{to{background-position:0 130px}}

/* === Анимации и новые иконки === */
button,.btn,.opt,.row,.mini,.back,.x,.av,.hov,.chip{-webkit-tap-highlight-color:transparent}
nav button,.tabs button,.opt,.row,.mini,.back,.x,.av,.btn{transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .2s,border-color .2s,color .2s,box-shadow .2s,filter .2s}
nav button:hover{transform:translateY(-2px);background:var(--gd)}nav button:active{transform:scale(.9)}
nav button.on .ni,nav button.on .nf{animation:nb .5s cubic-bezier(.3,1.6,.5,1)}
.tabs button:hover,.mini:hover,.back:hover,.x:hover,.av:hover{transform:translateY(-2px);border-color:var(--g)}
.tabs button:active,.mini:active,.back:active,.x:active,.av:active,.row:active,.hov:active{transform:scale(.95)}
.row:hover{transform:translateX(4px)}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--g)}.opt:active:not(:disabled){transform:scale(.97)}.opt.on{animation:pop .3s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 6px 0 var(--bs)}.btn:active{transform:translateY(3px);box-shadow:none}
.av.on{transform:scale(1.12)}.card{transition:transform .2s,border-color .2s}
.ni{display:block;width:24px;height:24px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.nf{display:block;width:26px;height:26px;object-fit:contain}
.bigf{display:block;width:96px;height:96px;margin:0 auto;object-fit:contain}
.dotf{width:24px;height:24px;vertical-align:middle;object-fit:contain}
#lg{position:relative;display:inline-block;line-height:0}#lg #logo{display:block}
#hat{position:absolute;left:-12px;top:-14.5px;width:38px;transform:rotate(16deg);transform-origin:58% 66%;pointer-events:none;filter:drop-shadow(0 2px 2px #0006)}
@keyframes nb{0%{transform:scale(.7) rotate(-12deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
body[data-th="light"]{--bg:#e6eff9;--card:#fbfdff;--card2:#e3edf8;--ln:#c8d8ea;--g:#1a7fe0;--gd:#1a7fe022;--g2:#5fb0ff;--bs:#0f5cb0;--tx:#0f1b2b;--mu:#5a7089;--bad:#d64545;--gl:radial-gradient(70% 45% at 90% 10%,#b4d3f5b3,transparent 72%),radial-gradient(55% 40% at 4% 96%,#cde1f6,transparent 70%);color-scheme:light}
body[data-th="light"] .btn{color:#fff;box-shadow:0 4px 0 var(--bs)}body[data-th="light"] .card{box-shadow:0 6px 20px #0001}
body[data-th="light"] #logo{mix-blend-mode:multiply;filter:invert(1)}
.pimg{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}.avb{width:64px;height:64px;display:grid;place-items:center;font-size:40px;background:var(--card2);border-radius:50%;border:2px solid var(--ln)}
.sec{background:var(--card2);color:var(--tx);box-shadow:none}.sec:hover{box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* === Лендинг с летающим 3D-маскотом + десктопная вёрстка === */
#hero{display:none;min-height:100vh;position:relative;overflow:hidden;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:2vw;padding:0 7vw;background:radial-gradient(55% 60% at 72% 48%,#1d62b066 0%,transparent 70%),radial-gradient(40% 40% at 8% 100%,#2f8ff018,transparent 70%),var(--bg)}
body[data-th="light"] #hero{background:radial-gradient(55% 60% at 72% 48%,#bcd8f5 0%,transparent 70%),var(--bg)}
body.landing #hero{display:grid;animation:hin .7s ease both}
body.landing header,body.landing nav,body.landing main{display:none}
@keyframes hin{from{opacity:0}}
#hero h1{font-size:clamp(52px,7.2vw,118px);line-height:.95;letter-spacing:-.035em;font-weight:900;margin:0 0 22px}
#hero p{font-size:clamp(17px,1.5vw,22px);line-height:1.5;color:var(--mu);max-width:32em;margin:0 0 32px}
#hero .hb{display:flex;gap:14px;flex-wrap:wrap}#hero .hb .btn{display:inline-block;width:auto;margin:0;padding:16px 34px;font-size:18px}
#hero .ht{transition:opacity .45s,transform .45s}
.hx{position:relative;width:min(100%,640px);aspect-ratio:720/749;justify-self:center;perspective:1300px;cursor:grab;transition:transform .52s cubic-bezier(.5,0,.75,.4),opacity .52s}
.hf,.hp,.hd{position:absolute;inset:0;transform-style:preserve-3d}
.hf{animation:fly 6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(8px) rotateZ(-2.5deg)}50%{transform:translateY(-30px) rotateZ(2.5deg)}}
.hl{position:absolute;inset:0;background:var(--mascot) center/contain no-repeat;pointer-events:none}
.hl.f{animation:glw 3.2s ease-in-out infinite}
@keyframes glw{0%,100%{filter:drop-shadow(0 0 18px #19e6d366)}50%{filter:drop-shadow(0 0 46px #4dfff0cc) brightness(1.08)}}
.hs{position:absolute;left:20%;right:20%;bottom:-9%;height:7%;border-radius:50%;background:radial-gradient(#00e5ff66,transparent 70%);filter:blur(10px);animation:shd 6s ease-in-out infinite}
@keyframes shd{50%{transform:scale(.72);opacity:.45}}
.pt{position:absolute;bottom:18%;border-radius:50%;background:#7fffe9;box-shadow:0 0 10px #4dfff0;opacity:0;animation:rise var(--d) linear var(--s) infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-420px) translateX(var(--x));opacity:0}}
#hero.out .ht{opacity:0;transform:translateX(-60px)}#hero.out .hx{transform:translate(-40vw,-44vh) scale(.07);opacity:0}
#lg{cursor:pointer}
@media(max-width:899px){#hero{grid-template-columns:1fr;padding:32px 6vw;text-align:center;justify-items:center}#hero .hb{justify-content:center}.hx{width:min(78vw,420px);grid-row:1}}
@media(min-width:1200px){
header{padding-left:32px;padding-right:32px}
nav{width:230px!important}nav button{font-size:16px!important;padding:14px 16px!important}
main{margin-left:230px!important;max-width:1240px!important;padding:32px 56px 48px!important}
.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
h1{font-size:36px}.q{font-size:24px}.art p{font-size:18px}.opt{padding:16px 18px;font-size:17px}.btn{max-width:420px}
}
@media(min-width:1700px){main{max-width:1400px!important}}

#logo{height:20px}#hat{left:-14px;top:-15px;width:34px}
#hero h1{margin:0 0 28px;line-height:0}#hero h1 img{display:block;width:min(100%,600px);height:auto}
body[data-th="light"] #hero h1 img{filter:invert(1)}
.hx{transition:transform .9s cubic-bezier(.55,0,.25,1),opacity .15s .78s}
#hero.out .hx{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}
@keyframes rdn{from{transform:translateY(-100%);opacity:0}}
@keyframes rsl{from{transform:translateX(-46px);opacity:0}}
@keyframes rpop{from{opacity:0;transform:translateY(40px) scale(.93)}}
body.reveal header{animation:rdn .5s cubic-bezier(.2,.8,.2,1) both}
body.reveal nav{animation:rsl .55s .1s cubic-bezier(.2,.8,.2,1) both}
body.reveal #m h1,body.reveal #m>p{animation:rsl .5s .2s cubic-bezier(.2,.8,.2,1) both}
body.reveal .grid>*{animation:rpop .6s cubic-bezier(.2,.9,.3,1.15) both}
body.reveal .grid>*:nth-child(1){animation-delay:.3s}body.reveal .grid>*:nth-child(2){animation-delay:.4s}body.reveal .grid>*:nth-child(3){animation-delay:.5s}body.reveal .grid>*:nth-child(4){animation-delay:.6s}body.reveal .grid>*:nth-child(n+5){animation-delay:.7s}
#chips{display:flex;flex-wrap:nowrap;align-items:center;flex-shrink:0}#lg{flex-shrink:1;min-width:0}header{gap:8px}
@media(max-width:600px){header{padding-left:12px!important;padding-right:12px!important}#logo{height:15px}#hat{left:-10px;top:-12px;width:26px}.chip{padding:4px 8px;font-size:13px;margin-left:4px}}
@media(max-width:899px){main{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}}#lvi{flex:1 1 0;min-width:0;max-width:124px;margin:-8px auto;padding:8px 0;cursor:pointer;display:flex;flex-direction:column;gap:3px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}#lvi b{font-size:12px;line-height:14px;font-weight:700;color:var(--tx);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lvi .lvt{display:block;height:4px;border-radius:99px;background:var(--ln);overflow:hidden}#lvi .lvt i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .6s cubic-bezier(.2,.8,.2,1)}#lvi:active{opacity:.7}#lvi:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:6px}@media(max-width:600px){#lvi{max-width:104px}#lvi b{font-size:11px;line-height:13px}}
</style><style>

@media(max-width:899px){
nav{padding-left:2px;padding-right:2px}
nav button{flex:1 1 0;padding:6px 0;font-size:clamp(8.5px,2.7vw,11px);line-height:1.2;letter-spacing:-.1px;white-space:nowrap}
}
.pp{padding:14px 16px;margin-bottom:10px;background:var(--card);border:1px solid var(--ln);border-radius:16px;cursor:pointer;transition:border-color .2s,transform .18s}.pp:hover{border-color:var(--g)}.pp:active{transform:scale(.98)}.pp b{font-weight:700;line-height:1.35}.pp.sub{margin-left:16px;padding:10px 14px;font-size:15px}.pp.off{opacity:.72}.pp .pgr{margin-top:6px}
.plv{animation:plIn .32s cubic-bezier(.2,.8,.2,1) both}@keyframes plIn{from{opacity:0;transform:translateY(12px)}}
.pls3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.pst{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;transition:transform .18s,border-color .2s}.pst:active{transform:scale(.96)}.pst b{display:block;font-size:28px;line-height:1.1}.pst span{font-size:12px;color:var(--mu)}
.plc{background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--c);border-radius:16px;padding:12px 14px;margin-bottom:10px;animation:plIn .3s both}.plc.dn .plt{text-decoration:line-through;opacity:.6}
.plr{display:flex;gap:12px;align-items:flex-start}.plk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ln);background:none;color:var(--on);font-weight:900;cursor:pointer;transition:transform .18s,background-color .2s}.plk:active{transform:scale(.88)}.plk.on{background:var(--g);border-color:var(--g)}
.plb{flex:1;min-width:0;cursor:pointer}.plt{display:block;word-break:break-word}.plm{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--mu);margin-top:4px}.pls.done{color:var(--g)}.pls.over{color:var(--bad)}.pls.wait{color:var(--tx)}
.pld{margin-top:10px;border-top:1px solid var(--ln);padding-top:10px;animation:plIn .25s both}
.pcg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.pwh{text-align:center;color:var(--mu);font-size:12px;margin-bottom:4px}
.pcd{min-height:50px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;padding:5px 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;text-align:center;line-height:1.2;transition:transform .15s,background-color .2s}.pcn{display:block;width:100%;text-align:center}.pcd:active{transform:scale(.92)}.pcd.ot{opacity:.4}.pcd.td{border-color:var(--g);box-shadow:inset 0 0 0 1px var(--g)}.pcd.sl{background:var(--g);color:var(--on);font-weight:800}
.pcd em{display:flex;align-items:center;justify-content:center;box-sizing:border-box;height:16px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--c);color:#fff;font-size:11px;line-height:1;font-style:normal;font-weight:800}.pcd em.e0{visibility:hidden}.pcg.w .pcd{min-height:84px;font-size:18px}
.plch{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.plp{border:1px solid var(--c);background:none;color:var(--tx);border-radius:99px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer;transition:transform .15s,background-color .2s}.plp:active{transform:scale(.94)}.plp.on{background:var(--c);color:#06231a;font-weight:700}
.plf label{display:block;color:var(--mu);font-size:14px;margin-top:8px}textarea.inp{resize:vertical}
.plv .inp{box-sizing:border-box;display:block;width:100%;max-width:100%;min-width:0;min-height:52px;-webkit-appearance:none;appearance:none;margin:6px 0}.plv input[type=date].inp,.plv input[type=time].inp{text-align:left;line-height:1.3}.plv .inp::-webkit-date-and-time-value{text-align:left;min-height:1.3em;margin:0}.plv .inp::-webkit-datetime-edit{padding:0}.plv textarea.inp{min-height:84px}.plv .card,.plv .plc{overflow:hidden;box-sizing:border-box;max-width:100%}
#lg{cursor:default}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;background:radial-gradient(60% 46% at 50% 40%,#1d62b066 0%,transparent 72%),var(--bg);transition:opacity .45s ease,visibility .45s}
body[data-th="light"] #splash{background:radial-gradient(60% 46% at 50% 40%,#bcd8f5 0%,transparent 72%),var(--bg)}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.spm{width:min(60vw,36vh,280px);aspect-ratio:720/749;background:var(--mascot) center/contain no-repeat;filter:drop-shadow(0 0 26px #3d96f566);animation:spIn .75s cubic-bezier(.2,.9,.3,1.15) both,spFl 3.2s ease-in-out .75s infinite}
#spl{display:block;width:min(78vw,380px);height:auto;filter:drop-shadow(0 0 22px #3d96f555);animation:spIn .75s cubic-bezier(.2,.9,.3,1.15) both,spFl 3.2s ease-in-out .75s infinite}
body[data-th="light"] #spl{filter:invert(1) drop-shadow(0 0 22px #3d96f544)}
.spb{width:min(46vw,170px);height:4px;border-radius:4px;background:var(--card2);overflow:hidden;animation:spUp .6s .4s both}
.spb i{display:block;width:40%;height:100%;border-radius:4px;background:var(--g);animation:spBar 1.1s ease-in-out infinite}
.spt{margin:0;font-size:14px;color:var(--mu);animation:spUp .6s .5s both}
@keyframes spIn{from{opacity:0;transform:scale(.7) translateY(18px)}}
@keyframes spFl{50%{transform:translateY(-10px)}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){.spm,#spl,.spb i{animation:none}.spb i{width:100%}}

.pgh{background:linear-gradient(135deg,color-mix(in srgb,var(--g) 24%,var(--card)),var(--card) 72%)}.pgf{width:60px;height:60px;object-fit:contain;display:block;margin:0 auto}.pgr0{margin:10px 0 0}.pgr0 .pb{height:12px}
.pgt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pgt div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}.pgt b{display:block;font-size:17px}.pgt span{font-size:12px;color:var(--mu)}
.prs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.prs .card{margin:0;padding:14px;min-width:0}.prs .mu{font-size:12px}.pge{color:var(--g);vertical-align:-4px;margin-right:2px;flex:none}.pgg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.pgg .card{margin:0;padding:12px 10px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}.pgg .card .mu{font-size:12px;line-height:1.25}.pgg .pgi{margin-bottom:6px}.pgi{width:36px;height:36px;border-radius:12px;background:var(--gd);color:var(--g);display:flex;align-items:center;justify-content:center;margin-bottom:8px}.pgv{font-size:22px;font-weight:800;line-height:1.15}

.sjr svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.sjr circle{fill:none;stroke-width:5}
.sjr .tk{stroke:color-mix(in srgb,var(--sa) 16%,transparent)}
.sjr .pg{stroke:var(--sa);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.22,.8,.3,1),opacity .25s}
.sjr.z .pg{opacity:0}
.sjr b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:color-mix(in srgb,var(--sa) 75%,var(--tx));font-variant-numeric:tabular-nums}
.sjr b small{font-size:.68em;font-weight:700;margin-left:1px}
.sjr.z b{color:var(--mu)}
/* Линза навигации */
nav .nvp{z-index:2;overflow:hidden;-webkit-backdrop-filter:blur(0px) saturate(1.3)!important;backdrop-filter:blur(0px) saturate(1.3)!important;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06))!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.28)!important}
nav .nvp.mv,nav .nvp.drag{scale:1.3;-webkit-backdrop-filter:blur(9px) saturate(1.6) brightness(1.1)!important;backdrop-filter:blur(9px) saturate(1.6) brightness(1.1)!important;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 50%,rgba(255,255,255,.14))!important;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.3),inset 0 12px 14px -8px rgba(0,0,0,.5),inset 0 -12px 14px -8px rgba(0,0,0,.45),inset 0 0 22px rgba(120,150,255,.22),0 14px 30px rgba(0,0,0,.5)!important}
nav .nvp::before{inset:0;padding:2.5px;opacity:0;filter:blur(.5px);z-index:3;transition:opacity .22s;background:conic-gradient(from 200deg,#7fa6ff,#b48cff,#ff9ec7,#ffcf7a,#8fe9ff,#7fa6ff)}
nav .nvp.mv::before,nav .nvp.drag::before{opacity:.9}
nav .nvp::after{display:none}
.nvc{position:absolute;left:0;top:0;pointer-events:none;opacity:0;font-style:normal;transition:opacity .22s,translate .5s cubic-bezier(.3,1.35,.5,1)}
nav .nvp.mv .nvc,nav .nvp.drag .nvc{opacity:1}
.nvb{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;color:var(--mu);white-space:nowrap}
.nvb.on,.nvb.hv{color:var(--g)}nav.dg .nvb.on:not(.hv){color:var(--mu)}
</style>

const runOk=k=>!/^tr:om/.test(k);

function begin(name,key,tasks,s){pgEns();const sv=(P.runs||{})[key];
if(sv&&runOk(key)&&Array.isArray(sv.tasks)&&sv.tasks.length&&sv.i<sv.tasks.length&&(key.indexOf(':')>0||(sv.tasks.length==tasks.length&&sv.tasks[0].q==tasks[0].q))){V.run={...sv,name,s};if(sv.fresh){delete V.run.fresh;init()}else V.run.tk=document.hidden?null:Date.now();return render()}
if(sv)delete P.runs[key];
V.run={name,key,tasks,s,i:0,ok:0,n:0,sid:pgId(),t0:Date.now(),act:0,sk:0};init();render()}
function init(){const r=V.run,t=r.tasks[r.i];r.tk=document.hidden?null:Date.now();r.sel=t.y=='m'?[]:null;r.val='';r.res=null;if(t.y=='o'){r.ord=sh(t.o);r.seq=[]}}

const startT=(s,y)=>begin('Тренажёр: '+TY[y],'tr:'+s+y,sh(pool(s).filter(t=>t.y==y)).slice(0,10),s);

/* ===== Прогресс: статистика обучения (v1). Данные: P.st в общем хранилище ===== */
const PG_V=1,pgAdd=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)},
pgDate=(s,o)=>new Date(s+'T12:00:00').toLocaleDateString('ru',o||{day:'numeric',month:'long'}),
pgT=s=>{s=Math.round(s||0);if(s<=0)return '0 мин';if(s<60)return s+' сек';const m=Math.round(s/60);return m<60?m+' мин':Math.floor(m/60)+' ч'+(m%60?' '+m%60+' мин':'')},
pgId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function pgEns(skip){if(P.st&&P.st.v==PG_V)return P.st;
const o=P.st&&typeof P.st=='object'?P.st:{},st={v:PG_V,ss:Array.isArray(o.ss)?o.ss:[],ev:Array.isArray(o.ev)?o.ev:[],best:o.best||0,mig:o.mig||0};
if(!st.mig){const inf=n=>{for(const s of SJ)if(lessons(s.id).some(l=>l.n==n))return s.id;return null};
(P.hist||[]).slice(skip||0).reverse().forEach((h,i)=>{if(h&&h.d)st.ss.push({id:'L'+h.d+'_'+i,d:h.d,t:0,du:0,s:inf(h.n),k:h.t||0,ok:h.ok||0,xp:h.xp||0,c:0,nm:h.n||'Занятие',p:0,lg:1})});st.mig=1}
P.st=st;st.best=Math.max(st.best,pgSt().best);return st}
function pgTick(r){if(r&&r.tk){r.act=(r.act||0)+Math.min(Date.now()-r.tk,3e5);r.tk=Date.now()}}
document.addEventListener('visibilitychange',()=>{const r=V.run;if(!r)return;if(document.hidden){pgTick(r);runSave();r.tk=null}else r.tk=Date.now()});
function pgDays(){const s=new Set(P.days||[]);((P.st&&P.st.ss)||[]).forEach(x=>s.add(x.d));return s}
function pgSt(){const set=pgDays(),a=[...set].sort();let best=0,run=0,prev=null;
for(const d of a){run=prev&&pgAdd(prev,1)==d?run+1:1;if(run>best)best=run;prev=d}
let cur=0,d=today();if(!set.has(d))d=pgAdd(d,-1);while(set.has(d)){cur++;d=pgAdd(d,-1)}
return{cur,best:Math.max(best,(P.st&&P.st.best)||0),days:set}}
function pgMap(sub){const m={};P.st.ss.forEach(x=>{if(sub&&x.s!=sub)return;const e=m[x.d]||(m[x.d]={ss:0,du:0,k:0,ok:0});if(!x.p)e.ss++;e.du+=x.du||0;e.k+=x.k||0;e.ok+=x.ok||0});return m}
function pgSum(m,a,b){const r={ss:0,du:0,k:0};for(let d=a;d<=b;d=pgAdd(d,1)){const e=m[d];if(e){r.ss+=e.ss;r.du+=e.du;r.k+=e.k}}return r}
function pgSubj(){const a={};SJ.concat(OSJ.filter(s=>s.id=='ma')).forEach(s=>a[s.id]={id:s.id,n:s.n,i:s.i,du:0,ss:0,k:0,ok:0});
P.st.ss.forEach(x=>{if(!x.s)return;const e=a[x.s];if(!e)return;if(!x.p)e.ss++;e.du+=x.du||0;e.k+=x.k||0;e.ok+=x.ok||0});
return Object.values(a).filter(e=>e.id!='ma'||e.ss||e.k||e.du)}
function pgRecs(){const m=pgMap();let du={v:0},ss={v:0},k={v:0};
for(const d in m){const e=m[d];if(e.du>du.v)du={v:e.du,d};if(e.ss>ss.v)ss={v:e.ss,d};if(e.k>k.v)k={v:e.k,d}}
let top=null;pgSubj().forEach(x=>{if(x.du||x.ss){if(!top||x.du>top.du||(x.du==top.du&&x.ss>top.ss))top=x}});
return{du,ss,k,best:pgSt().best,top}}
/* запись завершённого занятия: вызывается из fin() один раз на занятие */
function pgRec(r,xp,c,full){const had=P.st&&P.st.v==PG_V;pgEns(had?0:1);const st=P.st;
if(!r.sid||st.ss.some(x=>x.id==r.sid))return;pgTick(r);
const bf=pgRecs(),first=!st.ss.some(x=>x.d==today()),now=Date.now(),td=today();
st.ss.push({id:r.sid,d:td,t:now,t0:r.t0||now,du:Math.round((r.act||0)/1000),s:r.s,k:Math.max(0,r.n-(r.sk||0)),ok:r.ok,xp,c,nm:r.name,p:full?0:1});
const af=pgRecs(),sc=pgSt(),ev=(ic,tx)=>st.ev.push({t:now+1,d:td,ic,tx});
if(bf.du.v>0&&af.du.v>bf.du.v&&af.du.d==td)ev('🏆','Новый рекорд: самый долгий день — '+pgT(af.du.v));
if(bf.k.v>0&&af.k.v>bf.k.v&&af.k.d==td)ev('🏆','Новый рекорд: заданий за день — '+af.k.v);
if(bf.ss.v>0&&af.ss.v>bf.ss.v&&af.ss.d==td)ev('🏆','Новый рекорд: занятий за день — '+af.ss.v);
if(first&&sc.cur>=2){ev('🔥','Серия продлена: '+sc.cur+' дн. подряд');if(sc.cur>st.best&&st.best>=2)ev('🏆','Новый рекорд серии — '+sc.cur+' дн.')}
st.best=Math.max(st.best,sc.cur);st.ev=st.ev.slice(-100)}

S.push({...e,lbl:dt.toLocaleDateString('ru',{month:'short'}).replace('.',''),full:dt.toLocaleDateString('ru',{month:'long',year:'numeric'})})}return S}
const n=p=='m'?30:7;

S.push({du:e.du,ss:e.ss,k:e.k,lbl:p=='m'?String(+d.slice(8)):pgDate(d,{weekday:'short'}),full:pgDate(d,{weekday:'long',day:'numeric',month:'long'})})}
