<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MATLINGO</title>
<style>
:root{--bg:#07191E;--card:#0e2830;--card2:#13343d;--ln:#1f4650;--g:#02F5A1;--gd:#02f5a126;--tx:#eaf7f3;--mu:#8fb0aa;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
body[data-ny="1"]{--g:#7fe9ff;--gd:#7fe9ff26}
body[data-ny="1"]::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.85;background:radial-gradient(2px 2px at 20px 30px,var(--sf),transparent),radial-gradient(3px 3px at 90px 80px,var(--sf),transparent),radial-gradient(2px 2px at 60px 110px,var(--sf2),transparent);background-size:130px 130px;animation:sn 9s linear infinite;filter:var(--sg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:19px 16px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}
#logo{height:26px;mix-blend-mode:screen}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;cursor:pointer}
nav button.on{color:var(--g);background:var(--gd)}
main{max-width:900px;margin:0 auto;padding:16px 16px 100px}
@media(min-width:900px){nav{top:calc(57px + env(safe-area-inset-top,0px));bottom:auto;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:12px}nav button{flex-direction:row;font-size:15px;gap:10px;padding:12px}main{margin-left:190px;max-width:1000px;padding:24px 32px}}
h1{font-size:28px;margin:6px 0}h3{margin:0 0 4px;font-size:18px}.mu{color:var(--mu);margin:2px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #0005}
.hov{cursor:pointer;transition:transform .2s,border-color .2s}.hov:hover{transform:translateY(-3px);border-color:var(--g)}
.ic{font-size:34px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:12px;background:var(--card2);margin-top:8px;cursor:pointer}.row:hover{outline:1px solid var(--g)}
.btn{display:block;width:100%;background:var(--g);color:var(--bg);border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #0a8a63;margin-top:14px}.btn:active{transform:translateY(3px);box-shadow:none}
.mini,.back,.x{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer;text-decoration:none;font-size:14px}.back{margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:5px 10px;font-size:14px;margin-left:6px;white-space:nowrap}
.bar{height:12px;background:var(--card2);border-radius:9px;overflow:hidden;flex:1;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .4s}
.top{display:flex;gap:12px;align-items:center}.q{font-size:20px;font-weight:700;margin:12px 0;background:var(--card)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:14px;padding:14px;margin-top:10px;font:inherit;cursor:pointer}
.opt.on{border-color:var(--g);background:var(--gd)}.line{min-height:56px;border-bottom:2px dashed var(--ln);padding-bottom:6px}.line .opt{display:inline-block;width:auto;margin:4px}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin:6px 0}.inp:focus,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--g)}
.fb{padding:14px;border-radius:14px;margin-top:14px}.fb.ok{background:var(--gd);border:1px solid var(--g);animation:pop .4s}.fb.bad{background:#ff6b6b22;border:1px solid var(--bad);animation:sk .4s}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 16px}.tabs button{background:var(--card);border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:8px 14px;font:inherit;white-space:nowrap;cursor:pointer}.tabs .on{background:var(--g);color:var(--bg);border-color:var(--g);font-weight:700}
.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;margin:14px auto}.ring b{width:98px;height:98px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px}
.dots{display:flex;gap:8px;justify-content:space-between}.dots div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.dots span{display:block;height:34px;margin-bottom:4px;border-radius:10px;background:var(--card2);line-height:34px;font-size:18px}
.av{font-size:28px;background:var(--card2);border:2px solid var(--ln);border-radius:14px;padding:4px 8px;cursor:pointer}.av.on{border-color:var(--g)}.big{font-size:56px;text-align:center}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes sn{to{background-position:0 130px}}

/* === Анимации и новые иконки === */
button,.btn,.opt,.row,.mini,.back,.x,.av,.hov,.chip{-webkit-tap-highlight-color:transparent}
nav button,.tabs button,.opt,.row,.mini,.back,.x,.av,.btn{transition:transform .18s cubic-bezier(.3,1.5,.5,1),background-color .2s,border-color .2s,color .2s,box-shadow .2s,filter .2s}
nav button:hover{transform:translateY(-2px);background:var(--gd)}nav button:active{transform:scale(.9)}
nav button.on .ni,nav button.on .nf{animation:nb .5s cubic-bezier(.3,1.6,.5,1)}
.tabs button:hover,.mini:hover,.back:hover,.x:hover,.av:hover{transform:translateY(-2px);border-color:var(--g)}
.tabs button:active,.mini:active,.back:active,.x:active,.av:active,.row:active,.hov:active{transform:scale(.95)}
.row:hover{transform:translateX(4px)}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--g)}.opt:active:not(:disabled){transform:scale(.97)}.opt.on{animation:pop .3s}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 6px 0 #0a8a63}.btn:active{transform:translateY(3px);box-shadow:none}
.av.on{transform:scale(1.12)}.card{transition:transform .2s,border-color .2s}
.ni{display:block;width:24px;height:24px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.nf{display:block;width:26px;height:26px;object-fit:contain}
.bigf{display:block;width:96px;height:96px;margin:0 auto;object-fit:contain}
.dotf{width:24px;height:24px;vertical-align:middle;object-fit:contain}
#lg{position:relative;display:inline-block;line-height:0}#lg #logo{display:block}
#hat{position:absolute;left:-12px;top:-14.5px;width:38px;transform:rotate(16deg);transform-origin:58% 66%;pointer-events:none;filter:drop-shadow(0 2px 2px #0006)}
@keyframes nb{0%{transform:scale(.7) rotate(-12deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}
body[data-th="light"]{--bg:#f3f8f6;--card:#fff;--card2:#e8f1ee;--ln:#c9dad5;--g:#0b9b6b;--gd:#0b9b6b22;--tx:#10262b;--mu:#587a74;--bad:#d64545;color-scheme:light}
body[data-th="light"] .btn{color:#fff;box-shadow:0 4px 0 #07694a}body[data-th="light"] .card{box-shadow:0 6px 20px #0001}
body[data-th="light"] #logo{mix-blend-mode:multiply;filter:invert(1)}
.pimg{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--g)}.avb{width:64px;height:64px;display:grid;place-items:center;font-size:40px;background:var(--card2);border-radius:50%;border:2px solid var(--ln)}
.sec{background:var(--card2);color:var(--tx);box-shadow:none}.sec:hover{box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* === Лендинг с летающим 3D-маскотом + десктопная вёрстка === */
#hero{display:none;min-height:100vh;position:relative;overflow:hidden;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:2vw;padding:0 7vw;background:radial-gradient(55% 60% at 72% 48%,#0f4d56 0%,transparent 70%),radial-gradient(40% 40% at 8% 100%,#02f5a118,transparent 70%),var(--bg)}
body[data-th="light"] #hero{background:radial-gradient(55% 60% at 72% 48%,#bfeee0 0%,transparent 70%),var(--bg)}
body.landing #hero{display:grid;animation:hin .7s ease both}
body.landing header,body.landing nav,body.landing main{display:none}
@keyframes hin{from{opacity:0}}
#hero h1{font-size:clamp(52px,7.2vw,118px);line-height:.95;letter-spacing:-.035em;font-weight:900;margin:0 0 22px}
#hero p{font-size:clamp(17px,1.5vw,22px);line-height:1.5;color:var(--mu);max-width:32em;margin:0 0 32px}
#hero .hb{display:flex;gap:14px;flex-wrap:wrap}#hero .hb .btn{display:inline-block;width:auto;margin:0;padding:16px 34px;font-size:18px}
#hero .ht{transition:opacity .45s,transform .45s}
.hx{position:relative;width:min(100%,640px);aspect-ratio:720/749;justify-self:center;perspective:1300px;cursor:grab;transition:transform .52s cubic-bezier(.5,0,.75,.4),opacity .52s}
.hf,.hp,.hd{position:absolute;inset:0;transform-style:preserve-3d}
.hf{animation:fly 6s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(8px) rotateZ(-2.5deg)}50%{transform:translateY(-30px) rotateZ(2.5deg)}}
.hl{position:absolute;inset:0;background:var(--mascot) center/contain no-repeat;pointer-events:none}
.hl.f{animation:glw 3.2s ease-in-out infinite}
@keyframes glw{0%,100%{filter:drop-shadow(0 0 18px #19e6d366)}50%{filter:drop-shadow(0 0 46px #4dfff0cc) brightness(1.08)}}
.hs{position:absolute;left:20%;right:20%;bottom:-9%;height:7%;border-radius:50%;background:radial-gradient(#00e5ff66,transparent 70%);filter:blur(10px);animation:shd 6s ease-in-out infinite}
@keyframes shd{50%{transform:scale(.72);opacity:.45}}
.pt{position:absolute;bottom:18%;border-radius:50%;background:#7fffe9;box-shadow:0 0 10px #4dfff0;opacity:0;animation:rise var(--d) linear var(--s) infinite;pointer-events:none}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-420px) translateX(var(--x));opacity:0}}
#hero.out .ht{opacity:0;transform:translateX(-60px)}#hero.out .hx{transform:translate(-40vw,-44vh) scale(.07);opacity:0}
#lg{cursor:pointer}
@media(max-width:899px){#hero{grid-template-columns:1fr;padding:32px 6vw;text-align:center;justify-items:center}#hero .hb{justify-content:center}.hx{width:min(78vw,420px);grid-row:1}}
@media(min-width:1200px){
header{padding-left:32px;padding-right:32px}
nav{width:230px!important}nav button{font-size:16px!important;padding:14px 16px!important}
main{margin-left:230px!important;max-width:1240px!important;padding:32px 56px 48px!important}
.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
h1{font-size:36px}.q{font-size:24px}.art p{font-size:18px}.opt{padding:16px 18px;font-size:17px}.btn{max-width:420px}
}
@media(min-width:1700px){main{max-width:1400px!important}}

#logo{height:20px}#hat{left:-14px;top:-15px;width:34px}
#hero h1{margin:0 0 28px;line-height:0}#hero h1 img{display:block;width:min(100%,600px);height:auto}
body[data-th="light"] #hero h1 img{filter:invert(1)}
.hx{transition:transform .9s cubic-bezier(.55,0,.25,1),opacity .15s .78s}
#hero.out .hx{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}
@keyframes rdn{from{transform:translateY(-100%);opacity:0}}
@keyframes rsl{from{transform:translateX(-46px);opacity:0}}
@keyframes rpop{from{opacity:0;transform:translateY(40px) scale(.93)}}
body.reveal header{animation:rdn .5s cubic-bezier(.2,.8,.2,1) both}
body.reveal nav{animation:rsl .55s .1s cubic-bezier(.2,.8,.2,1) both}
body.reveal #m h1,body.reveal #m>p{animation:rsl .5s .2s cubic-bezier(.2,.8,.2,1) both}
body.reveal .grid>*{animation:rpop .6s cubic-bezier(.2,.9,.3,1.15) both}
body.reveal .grid>*:nth-child(1){animation-delay:.3s}body.reveal .grid>*:nth-child(2){animation-delay:.4s}body.reveal .grid>*:nth-child(3){animation-delay:.5s}body.reveal .grid>*:nth-child(4){animation-delay:.6s}body.reveal .grid>*:nth-child(n+5){animation-delay:.7s}
#chips{display:flex;flex-wrap:nowrap;align-items:center;flex-shrink:0}#lg{flex-shrink:1;min-width:0}header{gap:8px}
@media(max-width:600px){header{padding-left:12px!important;padding-right:12px!important}#logo{height:15px}#hat{left:-10px;top:-12px;width:26px}.chip{padding:4px 8px;font-size:13px;margin-left:4px}}
@media(max-width:899px){main{padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}}

#sm .sc{width:min(400px,100%);text-align:center;position:relative;overflow:hidden;margin:0;animation:mi .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mi{from{opacity:0;transform:translateY(24px) scale(.94)}}
.pvb{display:inline-block;transform:scale(1.6);margin:34px 0 28px}.bought{animation:bp .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bp{0%{transform:scale(.3)}60%{transform:scale(2)}100%{transform:scale(1.6)}}
.cft{position:absolute;left:50%;top:34%;width:8px;height:12px;border-radius:2px;background:var(--c);animation:cf 1s ease-out forwards;pointer-events:none}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
/* рамки */
.fr{display:inline-grid;place-items:center;padding:4px;border-radius:50%;flex:none}.fr .avb,.fr .pimg{border:0}
.fr-simple{background:#b9c6c3}
.fr-grad{background:linear-gradient(135deg,#02F5A1,#4aa8ea,#b46bff)}
.fr-neon{background:#19e6ff;box-shadow:0 0 14px 3px #19e6ffaa;animation:ng 2s ease-in-out infinite}
@keyframes ng{50%{box-shadow:0 0 24px 7px #19e6ffcc}}
.fr-gold{background:linear-gradient(135deg,#fff3b0,#f5b301 40%,#b97800 60%,#ffe27a)}
.fr-anim{background:conic-gradient(from var(--a),#ff5f6d,#ffc371,#02F5A1,#4aa8ea,#b46bff,#ff5f6d);animation:sp 3s linear infinite}
@keyframes sp{to{--a:360deg}}
/* ники */
.nk-c1{color:#4aa8ea}.nk-c2{color:#ff7aa2}
.nk-g1,.nk-g2,.nk-sh,.nk-rb{background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.nk-g1{background-image:linear-gradient(90deg,#02F5A1,#4aa8ea)}
.nk-g2{background-image:linear-gradient(90deg,#ff7aa2,#ffc371)}
.nk-sh{background-image:linear-gradient(105deg,transparent 40%,#ffffffcc 50%,transparent 60%),linear-gradient(90deg,#02F5A1,#4aa8ea,#b46bff,#4aa8ea,#02F5A1);background-size:250% 100%,300% 100%;background-repeat:no-repeat,repeat-x;animation:shm 3s linear infinite}
@keyframes shm{from{background-position:120% 0,0 0}to{background-position:-120% 0,-300% 0}}
.nk-rb{background-image:linear-gradient(90deg,#ff3b3b,#ffb02e,#f6e84a,#2ee86b,#2ec8ff,#6a5cff,#d34bff,#ff3b3b);background-size:200% 100%;background-repeat:repeat-x;animation:rbm 4s linear infinite}
@keyframes rbm{to{background-position:-200% 0}}
.nk-an{color:#fff;text-shadow:0 0 8px #02F5A1,0 0 18px #4aa8ea}
.nk-an i{display:inline-block;font-style:normal;animation:wv 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*.08s)}
@keyframes wv{50%{transform:translateY(-4px);color:#02F5A1}}
body[data-th="light"] .nk-an{color:#0b6b4c;text-shadow:0 0 6px #02f5a199}

const TABS=[['study','','Учёба'],['book','','Учебник'],['oge','','ОГЭ'],['fire','','Огонёк'],['shop','','Магазин'],['prof','','Профиль']];
const ico=k=>k=='fire'?`<img class="nf" alt="" src="${FL}">`:`<span class="ni" style="--m:url(${IC[k]})"></span>`;
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="V.tab='${t[0]}';V.set=0;V.edit=0;V.run=null;V.result=null;render()">${ico(t[0])}${t[2]}</button>`).join('');
const lrow=l=>{const d=P.done[l.id];return `<div class="row" onclick="startL('${l.id}')"><span>${d?'✅':'▶️'} ${l.n}</span><span class="mu" style="margin:0">${l.T.length} зад.${d?' · '+d.ok+'/'+d.n:''}</span></div>`};
function study(){
if(!V.s)return `<h1>Учёба</h1><p class="mu">9 класс. Выберите предмет.</p><div class="grid">${SJ.map(s=>`<div class="card hov" onclick="V.s='${s.id}';V.q='';render()"><div class="ic">${s.i}</div><h3>${s.n}</h3><p class="mu">${D[s.id].length} тем, пройдено ${lessons(s.id).filter(l=>P.done[l.id]).length} из ${lessons(s.id).length} уроков</p></div>`).join('')}</div>`;
return `<button class="back" onclick="V.s=null;V.q='';render()">← Предметы</button><h1>${sj(V.s).n}</h1><input class="inp" id="tq" type="search" placeholder="🔍 Поиск по темам" value="${esc(V.q||'')}" oninput="V.q=this.value;$('#tl').innerHTML=topicList()"><div id="tl" style="margin-top:12px">${topicList()}</div>`}
const lp=l=>Math.min(l.T.length,Math.max((P.prog||{})[l.id]||0,P.done[l.id]?l.T.length:0));
const tp=t=>{const a=t.L.reduce((s,l)=>s+lp(l),0),b=t.L.reduce((s,l)=>s+l.T.length,0);return{a,b,p:b?Math.round(a*100/b):0}};
function topicList(){const q=(V.q||'').trim().toLowerCase(),r=D[V.s].filter(t=>!q||(t.n+' '+t.d+' '+t.L.map(l=>l.n).join(' ')).toLowerCase().includes(q));return r.map(t=>`<div class="card"><h3>${t.n}</h3><p class="mu">${t.d}</p>${(g=>`<div class="pgr"><div class="pb"><i style="width:${g.p}%"></i></div><b>${g.p}%</b></div><p class="mu" style="margin:4px 0 8px">${g.a} из ${g.b} заданий</p>`)(tp(t))}${t.L.map(lrow).join('')}</div>`).join('')||'<p class="mu">Ничего не найдено.</p>'}
function oge(){
if(!V.os)return `<h1>ОГЭ</h1><p class="mu">Выберите предмет подготовки.</p><div class="grid">${SJ.map(s=>`<div class="card hov" onclick="V.os='${s.id}';V.ot='tr';render()"><div class="ic">${s.i}</div><h3>${s.n}</h3></div>`).join('')}</div>`;
const s=V.os,tb={tr:'Тренажёры',bank:'Банк заданий',co:'Курсы',vid:'Видео'};
return `<button class="back" onclick="V.os=null;render()">← Предметы</button><h1>ОГЭ: ${sj(s).n}</h1><div class="tabs">${Object.entries(tb).map(([k,v])=>`<button class="${V.ot==k?'on':''}" onclick="V.ot='${k}';V.msg='';render()">${v}</button>`).join('')}</div>`+({tr:oTr,bank:oBank,co:oCo,vid:oVid}[V.ot])(s)}
const oTr=s=>`<div class="grid">${Object.entries(TY).map(([y,n])=>{const c=pool(s).filter(t=>t.y==y).length;return `<div class="card${c?' hov':''}" ${c?`onclick="startT('${s}','${y}')"`:''}><h3>${n}</h3><p class="mu">${c?c+' заданий, серия до 10':'Заданий этого типа пока нет'}</p></div>`}).join('')}</div>`;
function oBank(s){return `<div class="card"><h3>Банк заданий ФИПИ</h3><p class="mu">Официальные задания ОГЭ на сайте ФИПИ.</p><a class="btn" style="text-align:center;text-decoration:none" href="https://oge.fipi.ru/bank/" target="_blank" rel="noopener">Открыть банк заданий ФИПИ</a></div>`}
function oCo(s){const ls=lessons(s),d=ls.filter(l=>P.done[l.id]).length,ct=P.done['ct:'+s],cc=P.done['cc:'+s],p=Math.round((d+(ct?1:0))/(ls.length+1)*100);
return `<div class="card"><h3>Подготовка к ОГЭ: ${sj(s).n}</h3><div class="bar"><i style="width:${p}%"></i></div><p class="mu">${p}%. ${cc?'Курс пройден ✅':'За завершение курса: +50 XP и +25 монет'}</p></div>`+D[s].map((t,i)=>`<div class="card"><h3>Модуль ${i+1}. ${t.n}</h3><p class="mu">${t.d}</p>${t.L.map(lrow).join('')}</div>`).join('')+`<div class="card hov" onclick="startCT('${s}')"><h3>🏁 Итоговый тест</h3><p class="mu">8 заданий, зачёт от 60%${ct?'. Уже пройден.':''}</p></div>`}
const emb=u=>{let m=u.match(/rutube\.ru\/video\/([0-9a-f]+)/i);if(m)return 'https://rutube.ru/play/embed/'+m[1];m=u.match(/video(-?\d+)_(\d+)/);if(m&&/vk/i.test(u))return `https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}`;return ''};
function oVid(s){const it=P.vid.map((v,i)=>({...v,i})).filter(v=>v.s==s);
return `<div class="card"><h3>Добавить видео</h3><input class="inp" id="vt" placeholder="Название"><input class="inp" id="vp" placeholder="Тема ОГЭ"><input class="inp" id="vu" placeholder="Ссылка VK Видео или Rutube"><p class="mu">${esc(V.msg)}</p><button class="btn" style="margin-top:0" onclick="addV('${s}')">Добавить</button></div>`+(it.map(v=>{const e=emb(v.u);return `<div class="card"><h3>${esc(v.t)}</h3><p class="mu">${esc(v.p||'без темы')}</p>${V.open==v.i&&e?`<iframe src="${esc(e)}" allowfullscreen loading="lazy" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px"></iframe>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap">${e?`<button class="mini" onclick="V.open=${v.i};render()">Смотреть здесь</button>`:''}<a class="mini" href="${esc(v.u)}" target="_blank" rel="noopener">Открыть на платформе</a><button class="mini" onclick="P.vid.splice(${v.i},1);save();render()">Удалить</button></div></div>`}).join('')||'<p class="mu">Видео по этому предмету пока нет.</p>')}
function fire(){let n=0,d=new Date();if(!P.days.includes(ds(d)))d.setDate(d.getDate()-1);while(P.days.includes(ds(d))){n++;d.setDate(d.getDate()-1)}
const t=P.hist.filter(h=>h.d==today()).length,w=[...Array(7)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()+i);const on=P.days.includes(ds(x)),cur=i==0;return `<div${cur?' style="color:var(--g);font-weight:800"':''}><span${cur?' style="border:2px solid var(--g)"':''}>${cur||on?`<img class="dotf" alt="🔥" src="${FL}"${on?'':' style="opacity:.45;filter:grayscale(1)"'}>`:''}</span>${x.toLocaleDateString('ru',{weekday:'short'})}</div>`}).join('');
return `<h1>Огонёк</h1><div class="card"><img class="bigf" alt="🔥" src="${FL}"><h1 style="text-align:center">${n} дн. подряд</h1><p class="mu" style="text-align:center">${t?'Цель на сегодня выполнена ✅':'Пройдите хотя бы одно занятие, чтобы сохранить серию'}</p><div class="bar"><i style="width:${Math.min(t,1)*100}%"></i></div><p class="mu">Ежедневная цель: 1 занятие (сегодня: ${t})</p></div><div class="card"><h3>Неделя: сегодня и 6 дней вперёд</h3><div class="dots">${w}</div></div>`}
function prof(){if(V.set)return settings();const ks=Object.keys(P.done),dn=ks.filter(k=>!/^(tr|ct|cc|bk):/.test(k)).length,cc=ks.filter(k=>k.slice(0,3)=='cc:').length,tl=SJ.reduce((a,s)=>a+lessons(s.id).length,0);
return `<h1>Профиль</h1><div class="card">${head()}<h3>Уровень ${lvl()}</h3><div class="bar"><i style="width:${P.xp%100}%"></i></div><p class="mu">${P.xp} XP · до следующего уровня ${100-P.xp%100} XP · <span class="mc"></span> ${P.coins}</p><button class="mini" onclick="V.tab='shop';V.st='fr';render()">🛍️ Магазин и мои предметы</button></div>
<div class="grid"><div class="card"><h3>${dn}/${tl}</h3><p class="mu">уроков пройдено</p></div><div class="card"><h3>${cc}/${SJ.length}</h3><p class="mu">курсов пройдено</p></div><div class="card"><h3>${Math.round(dn/tl*100)}%</h3><p class="mu">общий прогресс</p></div></div>

function begin(name,key,tasks,s){V.run={name,key,tasks,s,i:0,ok:0,n:0};init();render()}
function init(){const r=V.run,t=r.tasks[r.i];r.sel=t.y=='m'?[]:null;r.val='';r.res=null;if(t.y=='o'){r.ord=sh(t.o);r.seq=[]}}
function startL(id){for(const s in D){const L=lessons(s).find(l=>l.id==id);if(L)return begin(L.n,id,L.T,s)}}
const startT=(s,y)=>begin('Тренажёр: '+TY[y],'tr:'+s+y,sh(pool(s).filter(t=>t.y==y)).slice(0,10),s);
const startCT=s=>begin('Итоговый тест','ct:'+s,sh(pool(s)).slice(0,8),s);
const startB=(s,o)=>begin('Банк заданий','bk:'+s+o,sh(P.bank.filter(b=>b.s==s&&!!b.off==!!o)).slice(0,15),s);
function can(){const r=V.run,t=r.tasks[r.i];return t.y=='s'?r.sel!==null:t.y=='m'?r.sel.length>0:t.y=='i'?r.val.trim()!='':r.seq.length==r.ord.length}
function pick(k){const r=V.run,t=r.tasks[r.i];if(t.y=='s')r.sel=k;else r.sel=r.sel.includes(k)?r.sel.filter(x=>x!=k):[...r.sel,k];render()}
function act(){const r=V.run,t=r.tasks[r.i];
if(r.res===null){if(!can())return;const n=s=>s.trim().toLowerCase().replace(',','.').replace('−','-');
r.res=t.y=='s'?r.sel===t.a:t.y=='m'?JSON.stringify([...r.sel].sort())==JSON.stringify(t.a):t.y=='i'?t.a.includes(n(r.val)):r.seq.map(k=>r.ord[k]).join('|')==t.o.join('|');
r.n++;if(r.res)r.ok++;return render()}
if(r.i+1>=r.tasks.length)return fin(1);r.i++;init();render();scrollTo(0,0)}
function fin(full){const r=V.run;if(!r.n){V.run=null;return render()}
{const L0=lessons(r.s).find(l=>l.id==r.key);if(L0){P.prog=P.prog||{};P.prog[r.key]=Math.max(P.prog[r.key]||0,Math.min(r.n,L0.T.length))}}
Eco.sync();const L1=lessons(r.s).find(l=>l.id==r.key),first=!P.done[r.key],good=r.key.slice(0,2)!='ct'||r.ok/r.n>=.6,old=lvl(),pt=[];let xp=0,c=0,bonus='';
const g=(k,a,w)=>{const x=Eco.grant(k,a,w);if(x){c+=x;pt.push(w+' +'+x)}};
if(full){if(first&&good){xp=10+r.ok*2;P.done[r.key]={ok:r.ok,n:r.n};g('L:'+r.key,L1?Eco.tier(L1):15,L1?'Урок: '+r.name:r.name);if(r.ok==r.n)g('P:'+r.key,5,'Идеальное прохождение')}else{xp=2;if(P.done[r.key]&&r.ok>P.done[r.key].ok)P.done[r.key]={ok:r.ok,n:r.n}}}
if(P.done['ct:'+r.s]&&!P.done['cc:'+r.s]&&lessons(r.s).every(l=>P.done[l.id])){P.done['cc:'+r.s]={ok:1,n:1};xp+=50;g('C:'+r.s,25,'Курс «'+sj(r.s).n+'» завершён');bonus='Курс «'+sj(r.s).n+'» завершён: +50 XP.'}
const st=P.stat[r.s]||{ok:0,n:0};P.stat[r.s]={ok:st.ok+r.ok,n:st.n+r.n};
P.hist.unshift({d:today(),n:r.name,ok:r.ok,t:r.n,xp});P.hist=P.hist.slice(0,40);if(!P.days.includes(today()))P.days.push(today());

V.result={name:r.name,ok:r.ok,n:r.n,xp,c,bonus:(pt.length?pt.join(' · ')+'. ':'')+bonus,rep:!first,part:!full};V.run=null;render()}

const expl=t=>{const e=(t.e||'').trim();return e.length>3&&e!='…'?e:(t.th?'Вспомните правило: '+t.th:'Ответ: '+ans(t)+'.')};

const TH={'СПП':'Сложноподчинённое предложение (СПП) состоит из главной и придаточной частей. Придаточная часть зависит от главной, к ней можно задать вопрос, и присоединяется она союзом (что, чтобы, потому что, если, когда) или союзным словом (который, где, куда, какой).|Придаточные бывают изъяснительные (отвечают на вопросы падежей), определительные (какой?) и обстоятельственные: времени, места, причины, цели, условия, образа действия, уступки.|Как разбирать: найдите грамматические основы, определите главную часть, поставьте вопрос к придаточной и найдите союз. Придаточная отделяется запятой, а если стоит внутри главной, то запятыми с двух сторон.','ССП':'Сложносочинённое предложение (ССП) состоит из равноправных частей, связанных сочинительными союзами: и, а, но, однако, или, либо, да (в значении «но» или «и»).|Союзы бывают соединительные (и, да), противительные (а, но, однако) и разделительные (или, либо, то… то). Перед союзом между частями ставится запятая.|Запятая не нужна, если у частей есть общий второстепенный член или общая придаточная часть: «Утром выпал снег и стало светло».','Квадратные уравнения':'Квадратное уравнение имеет вид ax² + bx + c = 0, где a ≠ 0. Число корней определяет дискриминант D = b² − 4ac.|Если D > 0, корня два: x = (−b ± √D) / 2a. Если D = 0, корень один: x = −b / 2a. Если D < 0, действительных корней нет.|Теорема Виета для x² + px + q = 0: x₁ + x₂ = −p и x₁ · x₂ = q. С её помощью корни подбирают устно и проверяют решение.','Неравенства':'Метод интервалов решает неравенства вида (x − a)(x − b) > 0 или < 0. Сначала находят нули множителей и отмечают их на числовой прямой — получаются промежутки.|Затем определяют знак на каждом промежутке: на самом правом он совпадает со знаком старшего коэффициента, а при переходе через корень знаки чередуются.|Выбирают промежутки нужного знака. Для строгих знаков (<, >) точки выколотые, для нестрогих (≤, ≥) закрашенные, и в ответе у них квадратные скобки.','Расчётные задачи':'В расчётных задачах сначала записывают «Дано», затем переводят все величины в СИ: км/ч в м/с (делим на 3,6), минуты в секунды, граммы в килограммы.|Выбирают формулу: скорость v = S / t, сила тяжести F = mg, закон Ома I = U / R, давление p = F / S. Выражают нужную величину и подставляют числа.|В конце проверяют единицы и здравый смысл ответа. Ответ записывают с единицей измерения.','Системы счисления':'В позиционной системе значение цифры зависит от её места в записи. В двоичной системе только цифры 0 и 1, основание равно 2.|Перевод в десятичную: умножаем цифры на степени двойки справа налево. 1011₂ = 8 + 0 + 2 + 1 = 11.|Перевод из десятичной: делим число на 2 с остатком и читаем остатки снизу вверх. 25 = 16 + 8 + 1, значит, 25 = 11001₂.','Логика':'Высказывание — утверждение, которое либо истинно (1), либо ложно (0). Основные операции: НЕ (инверсия), И (конъюнкция), ИЛИ (дизъюнкция).|И истинно только когда истинны оба операнда; ИЛИ ложно только когда ложны оба; НЕ меняет значение на противоположное.|Приоритет: сначала НЕ, затем И, затем ИЛИ; скобки меняют порядок. Вычисляйте выражение по шагам, подставляя 0 и 1.'};

const ap=()=>c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
const T=(x,y,s,ry,rz)=>`translate(${x}px,${y}px) scale(${s}) rotateY(${ry}deg) rotateZ(${rz}deg)`;
const from=()=>{const h=$('#cchip'),r=h&&h.getBoundingClientRect(),s=st.getBoundingClientRect();return r?{x:r.left+r.width/2-(s.left+s.width/2),y:r.top+r.height/2-(s.top+s.height/2)}:{x:0,y:-300}};
st.onpointerdown=e=>{dr=1;px=e.clientX;py=e.clientY;c.classList.remove('sn');st.setPointerCapture(e.pointerId);e.stopPropagation()};
st.onpointermove=e=>{if(!dr)return;ry+=(e.clientX-px)*.8;rx-=(e.clientY-py)*.8;px=e.clientX;py=e.clientY;ap()};
const up=()=>{if(!dr)return;dr=0;c.classList.add('sn');rx=Math.round(rx/360)*360;ry=Math.round(ry/360)*360;ap();setTimeout(()=>{c.classList.remove('sn');rx=ry=0;ap()},850)};
st.onpointerup=st.onpointercancel=up;
window.coin=()=>{if(busy||m.classList.contains('on'))return;busy=1;haptic(18);$('#cc').textContent=P.coins;rx=ry=0;c.classList.remove('sn');ap();m.classList.add('on');const f=from();
an=[m.animate([{opacity:0},{opacity:1}],{duration:260,fill:'both'}),st.animate([{opacity:0},{opacity:1}],{duration:260,fill:'both'}),
cw.animate([{transform:T(f.x,f.y,.08,-720,-30),offset:0},{transform:T(0,0,1.15,-40,4),offset:.78},{transform:T(0,0,1,0,0)}],{duration:900,easing:'cubic-bezier(.2,.75,.3,1)',fill:'both'}),
cg.animate([{transform:'scale(.4)',opacity:.9},{transform:'scale(1.5)',opacity:0}],{duration:800,delay:520,easing:'ease-out'})];
an[2].onfinish=()=>{busy=0;haptic(10)}};
const close=()=>{if(busy||!m.classList.contains('on'))return;busy=1;haptic(12);const f=from();c.classList.remove('sn');rx=ry=0;ap();an.forEach(a=>a.cancel());
const a=cw.animate([{transform:T(0,0,1,0,0),offset:0},{transform:T(0,0,1.12,120,-4),offset:.25},{transform:T(f.x,f.y,.08,540,25),offset:1}],{duration:600,easing:'cubic-bezier(.5,0,.75,.4)',fill:'forwards'});
an=[a,st.animate([{opacity:1},{opacity:1,offset:.6},{opacity:0}],{duration:600,fill:'forwards'}),m.animate([{opacity:1},{opacity:0}],{duration:420,delay:200,fill:'forwards'})];
a.onfinish=()=>{an.forEach(x=>x.cancel());m.classList.remove('on');busy=0}};
m.onclick=e=>{if(!e.target.closest('#cs'))close()};
setTimeout(()=>{m.style.opacity=0;m.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>{m.classList.remove('on');m.style.opacity=''}))},700)})();

/* === Лендинг: летающая 3D-голова === */
(function(){const hx=document.getElementById('hx'),hd=document.getElementById('hd'),hp=document.getElementById('hp'),hero=document.getElementById('hero');
const L=[...hd.children],n=L.length,gap=5;
L.forEach((l,i)=>{const z=(i-(n-1)/2)*gap;l.style.transform=`translateZ(${z}px)`;if(i==n-1)l.classList.add('f');else l.style.filter=`brightness(${(.28+.5*i/(n-1)).toFixed(2)})`});
for(let i=0;i<14;i++){const p=document.createElement('span');p.className='pt';const s=3+Math.random()*5;p.style.cssText=`left:${10+Math.random()*80}%;width:${s}px;height:${s}px;--d:${5+Math.random()*4}s;--s:${-Math.random()*8}s;--x:${(Math.random()-.5)*80}px`;hx.appendChild(p)}
let tx=0,ty=0,cx=0,cy=0,spin=0;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
addEventListener('mousemove',e=>{tx=(e.clientX/innerWidth-.5)*46;ty=-(e.clientY/innerHeight-.5)*30});
(function tick(){if(document.body.classList.contains('landing')&&!rm){cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;hd.style.transform=`rotateX(${cy.toFixed(2)}deg) rotateY(${cx.toFixed(2)}deg)`}requestAnimationFrame(tick)})();
hx.addEventListener('click',()=>{if(spin)return;spin=1;hp.animate([{transform:'rotateY(0)'},{transform:'rotateY(380deg)',offset:.8},{transform:'rotateY(360deg)'}],{duration:900,easing:'cubic-bezier(.3,1.2,.5,1)'}).onfinish=()=>spin=0});
window.enter=function(){const r=hx.getBoundingClientRect();hero.style.setProperty('--dx',(110-(r.left+r.width/2))+'px');hero.style.setProperty('--dy',(36-(r.top+r.height/2))+'px');
hero.classList.add('out');hp.animate([{transform:'rotateY(0)'},{transform:'rotateY(360deg)'}],{duration:900,easing:'cubic-bezier(.6,0,.3,1)'});
setTimeout(()=>{if(typeof V!=='undefined'&&V.tab!=='study'){const b=document.querySelector('#nav button[data-t="study"]');if(b)b.click()}
document.body.classList.remove('landing');document.body.classList.add('reveal');hero.classList.remove('out');scrollTo(0,0);setTimeout(()=>document.body.classList.remove('reveal'),1500)},930)};
document.getElementById('hlogo').src=document.getElementById('logo').src;document.getElementById('lg').onclick=()=>{document.body.classList.add('landing');scrollTo(0,0)};
document.body.classList.add('landing')})();

/* === Окно «XP и уровень» === */
function xpm(){const x=P.xp,l=lvl(),t=today(),td=P.hist.filter(h=>h.d==t).reduce((a,h)=>a+(h.xp||0),0),ls=Object.keys(P.done).filter(k=>!/^(tr|ct|cc|bk):/.test(k)).length,
rows=P.hist.slice(0,6).map(h=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--ln)"><span>${esc(h.n)}</span><b style="white-space:nowrap">+${h.xp} XP</b></div>`).join('')||'<p class="mu">Пока нет занятий.</p>';
const o=document.createElement('div');o.id='xm';o.style.cssText='position:fixed;inset:0;z-index:60;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px';
o.onclick=e=>{if(e.target==o)o.remove()};
o.innerHTML=`<div class="card" style="width:min(440px,100%);max-height:90vh;overflow:auto"><h2 style="margin:0 0 4px">⭐ Уровень ${l}</h2><p class="mu" style="margin:0">Всего ${x} XP</p><div class="bar"><i style="width:${x%100}%"></i></div><p class="mu" style="margin:0 0 14px">До уровня ${l+1} осталось ${l*100-x} XP</p><div style="display:flex;justify-content:space-between"><span>Сегодня</span><b>+${td} XP</b></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Пройдено уроков</span><b>${ls}</b></div><h3 style="margin:16px 0 6px">Последние начисления</h3>${rows}<h3 style="margin:16px 0 6px">Как начисляется XP</h3><p class="mu" style="margin:0">Первое прохождение урока: 10 XP + 2 за каждый верный ответ. Повтор: 2 XP. Завершение курса: +50 XP. Каждые 100 XP — новый уровень.</p><button class="btn" style="margin-top:14px" onclick="document.getElementById('xm').remove()">Закрыть</button></div>`;
document.body.appendChild(o)}
/* === Монеты, магазин и инвентарь (PAVSTUDY) === */
(function(){
const CAT={fr:{n:'Рамки',L:['Простая','Градиентная','Неоновая','Золотая','Анимированная'],P:[300,500,750,1000,1500],C:[0,1,2,3,4]},
nk:{n:'Оформление ника',L:['Цветной ник','Градиентный ник','Переливающийся ник','Радужный ник','Анимированный ник'],P:[400,650,1000,1300,1800],C:[0,1,2,3,4]},
tt:{n:'Титулы',L:['Обычный','Редкий','Эпический','Легендарный'],P:[300,500,800,1200],C:[0,2,3,4]}};
const RC=['#9fb3ad','#4ade80','#4aa8ea','#b46bff','#ffb02e'],ITEMS={};
[['fr',0,'Серебро','fr-simple'],['fr',1,'Северное сияние','fr-grad'],['fr',2,'Неон','fr-neon'],['fr',3,'Золото','fr-gold'],['fr',4,'Радужное кольцо','fr-anim'],
['nk',0,'Океан','nk-c1'],['nk',0,'Роза','nk-c2'],['nk',1,'Мята','nk-g1'],['nk',1,'Закат','nk-g2'],['nk',2,'Блеск','nk-sh'],['nk',3,'Радуга','nk-rb'],['nk',4,'Волна','nk-an'],
['tt',0,'Первокурсник'],['tt',0,'Любознайка'],['tt',1,'Решала'],['tt',1,'Грамотей'],['tt',2,'Гроза ОГЭ'],['tt',2,'Мастер формул'],['tt',3,'Легенда PAVSTUDY'],['tt',3,'Гений 9 класса']]
.forEach(([g,t,n,x],i)=>{const id=g+(i+10);/* прежняя нумерация id сохранена */ITEMS[id]={id,g,t,n,e:x,k:x,p:CAT[g].P[t],l:CAT[g].L[t],c:CAT[g].C[t]}});
const wk=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return ds(d)};
/* Единственное место, где меняются монеты: журнал операций P.led. Баланс и покупки ВСЕГДА пересчитываются из него. */
const Eco=window.Eco={wk,
sync(){P.led=Array.isArray(P.led)?P.led:[];P.eq=P.eq||{};P.fd=P.fd||[];
if(!P.mig){P.mig=1;if(P.coins>0&&!P.led.length)P.led.push({id:'init',a:Math.floor(P.coins),r:'Накоплено ранее',t:Date.now()})}
P.led.filter(x=>/^B:av/.test(x.id)).forEach(x=>{if(!P.led.some(y=>y.id=='R:'+x.id)){P.led.push({id:'R:'+x.id,a:-x.a,r:'Возврат: аватарки убраны из магазина',t:Date.now()});if(['🐱','🐶','🦁','🐧','🐲','🦈','👾','🤖','🦄','🦅'].includes(P.av))P.av='🦊'}});
let b=0;P.led.forEach(x=>{b+=+x.a||0});P.coins=Math.max(0,b);
['fr','nk','tt'].forEach(g=>{if(P.eq[g]&&!Eco.has(P.eq[g]))P.eq[g]=''})},
has:id=>P.led.some(x=>x.id=='B:'+id),
used:k=>P.led.some(x=>x.id==k),
grant(k,a,w){P.led=P.led||[];if(!(a>0)||Eco.used(k))return 0;P.led.push({id:k,a,r:w,t:Date.now()});return a},
buy(id){const it=ITEMS[id];if(!it)return{m:'Товар не найден'};Eco.sync();if(Eco.has(id))return{m:'Уже куплено'};
if(P.coins<it.p)return{m:'Недостаточно монет',need:it.p-P.coins};
P.led.push({id:'B:'+id,a:-it.p,r:'Покупка: '+it.n,t:Date.now()});Eco.sync();save();return{ok:1}},
equip(id){const it=ITEMS[id];if(!it||!Eco.has(id))return 0;P.eq[it.g]=P.eq[it.g]==id?'':id;save();return 1},
tier(l){const w={s:1,i:1.5,m:2,o:2},p=l.T.reduce((a,t)=>a+(w[t.y]||1),0);return p>=6?35:p>=5.5?25:15},
ed(){if(!P.ed||P.ed.d!=today())P.ed={d:today(),n:0,k:[]};P.ed.k=P.ed.k||[];return P.ed},
wd(){const s=wk();return(P.fd||[]).filter(x=>x>=s).length}};
const nkh=window.nkh=(n,e)=>{const it=ITEMS[e];if(!it)return esc(n);return `<span class="nk ${it.k}">${it.k=='nk-an'?[...n].map((c,i)=>`<i style="--i:${i}">${c==' '?'&nbsp;':esc(c)}</i>`).join(''):esc(n)}</span>`};
const tth=window.tth=id=>{const it=ITEMS[id];return it?`<span class="tt" style="--rc:${RC[it.c]}">${esc(it.n)}</span>`:''};
const FR=window.FR=(h,id)=>{const it=ITEMS[id];return it?`<span class="fr ${it.k}">${h}</span>`:h};
const pv=it=>it.g=='fr'?FR(AV(P.av,P.img),it.id):it.g=='nk'?`<b style="font-size:20px">${nkh(P.nick,it.id)}</b>`:tth(it.id);
const rp=it=>`<span class="rp" style="--rc:${RC[it.c]}">${it.l}</span>`,coin=n=>`<span class="mc"></span> ${n}`;
const on=it=>P.eq[it.g]==it.id;
const TB=[['fr','Рамки'],['nk','Ники'],['tt','Титулы'],['inv','Мои предметы'],['hist','История']];
const card=it=>{const own=Eco.has(it.id);return `<div class="card hov it${own?' own':''}" onclick="shopOpen('${it.id}')"><div class="pvw">${pv(it)}</div><h3>${esc(it.n)}</h3>${rp(it)}<div class="pr">${own?(on(it)?'✓ Надето':'✓ Куплено'):coin(it.p)}</div></div>`};
const inv=()=>{const o=Object.values(ITEMS).filter(i=>Eco.has(i.id));
if(!o.length)return `<div class="card"><h3>Пока пусто</h3><p class="mu">Купите первый предмет в магазине.</p><button class="btn" onclick="V.st='fr';render()">В магазин</button></div>`;
return Object.keys(CAT).map(g=>{const a=o.filter(i=>i.g==g);return a.length?`<h3 style="margin:14px 0 8px">${CAT[g].n}</h3><div class="grid shg">${a.map(i=>`<div class="card it${on(i)?' own':''}"><div class="pvw">${pv(i)}</div><h3>${esc(i.n)}</h3>${rp(i)}<button class="btn${on(i)?' sec':''}" style="margin-top:10px;padding:10px" onclick="shopEq('${i.id}')">${on(i)?'Снять':'Надеть'}</button></div>`).join('')}</div>`:''}).join('')};
const hist=()=>{const a=[...P.led].reverse(),e=a.reduce((s,x)=>s+(x.a>0?x.a:0),0),s=a.reduce((q,x)=>q+(x.a<0?-x.a:0),0);
return `<div class="card"><h3>История монет</h3><p class="mu">Получено ${e} · Потрачено ${s}</p>${a.map(x=>`<div class="row" style="cursor:default"><span>${esc(x.r)}<br><span class="mu" style="margin:0;font-size:13px">${new Date(x.t).toLocaleString('ru',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></span><b style="color:${x.a>0?'var(--g)':'var(--bad)'};white-space:nowrap">${x.a>0?'+':'−'}${Math.abs(x.a)} <span class="mc"></span></b></div>`).join('')||'<p class="mu">Операций пока нет.</p>'}</div>`};
window.shop=function(){Eco.sync();const t=V.st||'fr',e=Eco.ed(),w=Eco.wd();
const b=t=='inv'?inv():t=='hist'?hist():`<div class="grid shg">${Object.values(ITEMS).filter(i=>i.g==t).map(card).join('')}</div>`;
return `<h1>Магазин</h1><div class="card shb"><div><p class="mu" style="margin:0">Ваш баланс</p><div class="bal">${coin(P.coins)}</div></div><p class="mu gl">Сегодня: ${Math.min(e.n,2)}/2 занятия · +20<br>Неделя: ${Math.min(w,5)}/5 дней · +50</p></div><div class="tabs">${TB.map(([k,n])=>`<button class="${t==k?'on':''}" onclick="V.st='${k}';render()">${n}</button>`).join('')}</div>${b}`};
window.shopClose=()=>{const m=$('#sm');if(m)m.remove()};
const mdl=h=>{let m=$('#sm');if(!m){m=document.createElement('div');m.id='sm';m.onclick=e=>{if(e.target==m)shopClose()};document.body.appendChild(m)}m.innerHTML=`<div class="card sc">${h}</div>`};
const mbody=it=>{const own=Eco.has(it.id),need=it.p-P.coins;
return `<button class="x" style="position:absolute;right:12px;top:12px" onclick="shopClose()" aria-label="Закрыть">✕</button><div class="pvb">${pv(it)}</div><h2 style="margin:0">${esc(it.n)}</h2><p style="margin:6px 0">${rp(it)}</p><p class="mu">${CAT[it.g].n}</p>`+(own?`<p><b>✓ Куплено</b></p><button class="btn${on(it)?' sec':''}" onclick="shopEq('${it.id}',1)">${on(it)?'Снять':'Использовать'}</button>`:`<h2 style="margin:6px 0">${coin(it.p)}</h2>${need>0?`<p class="mu">У вас ${P.coins}, не хватает ${need}</p>`:''}<div id="sf"></div><button class="btn" onclick="shopBuy('${it.id}')">Купить</button>`)};
window.shopOpen=id=>{const it=ITEMS[id];if(it){Eco.sync();mdl(mbody(it))}};
window.shopBuy=id=>{const it=ITEMS[id],r=Eco.buy(id);
if(!r.ok){$('#sf').innerHTML=`<div class="fb bad"><b>${r.m}</b>${r.need?`<br>Нужно накопить ещё ${r.need} <span class="mc"></span>`:''}</div>`;haptic(30);return}
haptic(18);render();let c='';for(let i=0;i<28;i++){const a=Math.random()*6.28,d=80+Math.random()*120;c+=`<i class="cft" style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-30}px;--c:${RC[i%5]}"></i>`}
mdl(`${c}<div class="pvb bought">${pv(it)}</div><h2 style="margin:0">Куплено!</h2><p class="mu">«${esc(it.n)}» теперь в разделе «Мои предметы». Баланс: ${coin(P.coins)}</p><button class="btn" onclick="shopEq('${it.id}',1)">Использовать</button><button class="btn sec" onclick="shopClose()">Закрыть</button>`)};
window.shopEq=(id,close)=>{Eco.equip(id);if(close)shopClose();render()};
})();
/* === Перенос прогресса: Математика -> Алгебра/Геометрия === */
(function(){let ch=0;P.done=P.done||{};P.prog=P.prog||{};
['al','ge'].forEach(sb=>lessons(sb).forEach(l=>{const o=l.oid;if(!o)return;
if(o in P.done){if(!(l.id in P.done))P.done[l.id]=P.done[o];delete P.done[o];ch=1}
if(o in P.prog){if(!(l.id in P.prog))P.prog[l.id]=P.prog[o];delete P.prog[o];ch=1}}));
if(P.stat&&P.stat.ma){if(!P.stat.al)P.stat.al=P.stat.ma;delete P.stat.ma;ch=1}
(P.bank||[]).forEach(b=>{if(b.s=='ma'){b.s='al';ch=1}});
Object.keys(P.done).forEach(k=>{if(/^(ct|cc|tr|bk):ma/.test(k)){delete P.done[k];ch=1}});
if(ch)save()})();
render();
</script></body></html>
